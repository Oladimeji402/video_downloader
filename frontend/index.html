<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Add beautiful frames to TikTok, Instagram, YouTube and Twitter videos. Free online video framer." />
  <meta name="theme-color" content="#f8fdf9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>FrameIt — Frame Your Videos</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
  <script src="env.js"></script>
</head>
<body>
  <!-- Server status banner -->
  <div id="serverBanner" class="server-banner" aria-live="polite">
    <div class="server-banner-inner">
      <div class="server-banner-dot"></div>
      <span id="serverBannerText">Connecting to server...</span>
    </div>
  </div>

  <main class="app">
    <header class="header">
      <div class="logo">
        <svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="2" y="2" width="28" height="28" rx="6" stroke="url(#logoGrad)" stroke-width="2.5"/>
          <rect x="7" y="7" width="18" height="18" rx="3" stroke="url(#logoGrad)" stroke-width="1.5" opacity=".5"/>
          <polygon points="13,11 22,16 13,21" fill="url(#logoGrad)"/>
          <defs>
            <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32">
              <stop offset="0%" stop-color="#10b981"/>
              <stop offset="100%" stop-color="#059669"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">FrameIt</span>
      </div>
      <p class="tagline">Drop a link. Pick a frame. Share.</p>
    </header>

    <!-- Step 1: Input -->
    <section class="card input-section" id="inputSection">
      <div class="input-row">
        <label for="videoUrl" class="sr-only">Video URL</label>
        <input
          id="videoUrl"
          type="url"
          placeholder="Paste TikTok, IG, or YouTube link..."
          autocomplete="off"
          spellcheck="false"
          aria-label="Paste a TikTok, Instagram, YouTube, or Twitter video URL"
        />
        <button id="actionBtn" class="input-action-btn" type="button" aria-label="Paste URL from clipboard" title="Paste">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>

      <button id="previewBtn" class="btn-go" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
        <span>Go</span>
      </button>

      <div class="input-divider" aria-hidden="true"><span>or</span></div>

      <label class="btn-upload" for="videoUpload">
        <input type="file" id="videoUpload" accept="video/*,.mp4,.mov,.webm" hidden />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <span id="uploadBtnText">Upload video file</span>
      </label>

      <p class="upload-hint">Upload videos directly for faster processing</p>

      <div id="fetchErrorHint" class="fetch-error-hint hidden" role="alert">
        <p id="fetchErrorText"></p>
        <button id="retryUploadBtn" class="btn-upload-inline" type="button">Upload video instead</button>
      </div>

      <!-- Fetch progress -->
      <div id="fetchStatus" class="progress-strip hidden">
        <div class="progress-steps">
          <div class="progress-step" data-step="connecting">
            <span class="progress-step-dot"></span>
            <span>Connecting</span>
          </div>
          <span class="progress-step-arrow">→</span>
          <div class="progress-step" data-step="downloading">
            <span class="progress-step-dot"></span>
            <span>Downloading</span>
          </div>
          <span class="progress-step-arrow">→</span>
          <div class="progress-step" data-step="ready">
            <span class="progress-step-dot"></span>
            <span>Ready</span>
          </div>
        </div>
        <span id="fetchStatusText" class="progress-strip-text">Fetching video...</span>
        <div id="timeEstimate" class="time-estimate hidden"></div>
        <div id="progressTip" class="progress-tip hidden"></div>
        <div class="progress-strip-bar">
          <div id="fetchProgress" class="progress-strip-fill"></div>
        </div>
      </div>
    </section>

    <!-- Step 2: Preview + Frames (hidden by default) -->
    <section id="previewSection" class="card preview-section hidden">
      <div class="preview-header">
        <span id="previewSourceLabel" class="preview-source-label"></span>
        <button id="resetBtn" class="btn-reset" type="button" aria-label="Start over">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          Start over
        </button>
      </div>
      <div class="preview-container">
        <div id="framePreview" class="frame-preview">
          <video id="videoPlayer" controls playsinline webkit-playsinline preload="metadata"></video>
          <div id="frameOverlay" class="frame-overlay"></div>
        </div>
      </div>

      <div class="frame-selector">
        <p class="frame-selector-label">Frames</p>
        <div id="frameOptions" class="frame-options">
          <button class="frame-option selected" data-frame="none">
            <div class="frame-thumb no-frame">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
              </svg>
            </div>
            <span>None</span>
          </button>
        </div>
        <p id="noFramesMsg" class="no-frames-msg hidden">
          No frames available.
        </p>
      </div>
    </section>

    <!-- Step 3: Actions (hidden by default) -->
    <section id="downloadSection" class="card action-section hidden" aria-label="Share and download options">
      <div class="action-row-main">
        <button id="downloadBtn" class="btn-download-main" type="button" aria-label="Download video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Download</span>
        </button>
        <button id="shareBtn" class="btn-share-secondary" type="button" aria-label="Share video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span>Share</span>
        </button>
      </div>

      <!-- Render progress -->
      <div id="renderStatus" class="progress-strip hidden" role="status" aria-live="polite">
        <div class="progress-strip-bar">
          <div id="renderProgress" class="progress-strip-fill"></div>
        </div>
        <span id="renderStatusText" class="progress-strip-text">Rendering...</span>
      </div>
    </section>

    <footer class="footer">
      <p>Paste any TikTok, Instagram, YouTube, or X link</p>
    </footer>
  </main>

  <!-- Toast notifications -->
  <div id="toastContainer" class="toast-container" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="script.js"></script>
</body>
</html>
